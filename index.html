<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apna Earning</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5fa;font-family:Arial;color:#172033}
header{background:#142b55;color:white;text-align:center;padding:20px}
main{max-width:650px;margin:auto;padding:14px}
.card{background:white;padding:17px;border-radius:13px;margin:12px 0;box-shadow:0 2px 8px #0001}
input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd2dd;border-radius:8px;font-size:16px}
button{background:#1769e0;color:white;border:0;padding:12px 16px;border-radius:8px;margin:5px 3px;cursor:pointer}
.green{background:#16834b}.red{background:#c62828}
nav{display:flex;flex-wrap:wrap;gap:5px}
nav button{flex:1}
.hidden{display:none}
.task{border-bottom:1px solid #eee;padding:12px 0}
.small{color:#687386;font-size:13px}
</style>
</head>
<body>
<header>
<h2>🪙 APNA EARNING</h2>
<p>Complete Tasks • Earn Rewards</p>
</header>

<main>
<section id="login" class="card">
<h3>Login / Sign Up</h3>
<input id="phone" placeholder="+91 Mobile Number" type="tel">
<div id="recaptcha-container"></div>
<button id="sendOtp">Send OTP</button>
<input id="otp" placeholder="Enter OTP">
<button id="verifyOtp">Verify OTP</button>
<p id="loginMsg" class="small"></p>
</section>

<section id="app" class="hidden">
<div class="card">
<h3 id="welcome">Welcome!</h3>
<p>Wallet Balance: ₹<b id="balance">0</b></p>
<button class="red" id="logout">Logout</button>
</div>

<nav>
<button data-page="tasksPage">Tasks</button>
<button data-page="walletPage">Wallet</button>
<button data-page="adminPage" id="adminTab" class="hidden">Admin</button>
</nav>

<section id="tasksPage" class="card">
<h3>Available Tasks</h3>
<div id="tasksList">Loading...</div>
</section>

<section id="walletPage" class="card hidden">
<h3>My Wallet</h3>
<p>Balance: ₹<b id="walletBalance">0</b></p>
<p class="small">Withdrawal abhi activate nahi hai.</p>
</section>

<section id="adminPage" class="card hidden">
<h3>Admin Panel</h3>
<h4>Add New Task</h4>
<input id="taskTitle" placeholder="Task title">
<textarea id="taskDescription" placeholder="Task details"></textarea>
<input id="taskReward" type="number" min="1" placeholder="Reward in rupees">
<input id="taskLink" placeholder="Task link (optional)">
<button id="addTask">Add Task</button>
<p id="adminMsg" class="small"></p>
<hr>
<h4>Submissions</h4>
<button id="refreshSubmissions">Refresh Submissions</button>
<div id="submissionsList"></div>
</section>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getAuth,RecaptchaVerifier,signInWithPhoneNumber,
 onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
 getFirestore,doc,getDoc,setDoc,addDoc,collection,
 getDocs,query,where,serverTimestamp,runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCKTH6Ije52Z65ioPb0YsmhLkIGgxsN3rc",
 authDomain:"apna-earning-f8e64.firebaseapp.com",
 projectId:"apna-earning-f8e64",
 appId:"1:427177052936:web:524732d6e432313d983abd"
};

const ADMIN_UID="8fGPOp7D5jcF6pbIki4pJaHJI0E2";

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const db=getFirestore(firebaseApp);
const $=id=>document.getElementById(id);

let confirmation=null;
let captcha=null;
let currentUser=null;

function msg(id,text){$(id).textContent=text;}

$("sendOtp").onclick=async()=>{
 try{
  const phone=$("phone").value.trim();
  if(!/^\+91[0-9]{10}$/.test(phone)){
   msg("loginMsg","Number +91 ke saath 10 digits ka likho.");
   return;
  }
  if(!captcha){
   captcha=new RecaptchaVerifier(auth,"recaptcha-container",{size:"normal"});
  }
  confirmation=await signInWithPhoneNumber(auth,phone,captcha);
  msg("loginMsg","OTP bhej diya gaya hai.");
 }catch(e){
  msg("loginMsg","OTP error: "+e.message);
  if(captcha){try{await captcha.clear();}catch(_){}captcha=null;}
 }
};

$("verifyOtp").onclick=async()=>{
 try{
  if(!confirmation){msg("loginMsg","Pehle Send OTP dabao.");return;}
  await confirmation.confirm($("otp").value.trim());
  msg("loginMsg","Login successful!");
 }catch(e){
  msg("loginMsg","OTP galat ya expire ho gaya.");
 }
};

onAuthStateChanged(auth,async user=>{
 currentUser=user;
 if(!user){
  $("login").classList.remove("hidden");
  $("app").classList.add("hidden");
  return;
 }
 $("login").classList.add("hidden");
 $("app").classList.remove("hidden");
 $("welcome").textContent="Welcome! "+(user.phoneNumber||"");
 const admin=user.uid===ADMIN_UID;
 $("adminTab").classList.toggle("hidden",!admin);

 try{
  const userRef=doc(db,"users",user.uid);
  const userSnap=await getDoc(userRef);
  if(!userSnap.exists()){
   await setDoc(userRef,{
    phoneNumber:user.phoneNumber,
    createdAt:serverTimestamp()
   });
  }
  await loadTasks();
  await loadWallet();
 }catch(e){
  alert("Account load error: "+e.message);
 }
});

$("logout").onclick=()=>signOut(auth);

document.querySelectorAll("nav button[data-page]").forEach(btn=>{
 btn.onclick=()=>{
  ["tasksPage","walletPage","adminPage"].forEach(id=>$(id).classList.add("hidden"));
  $(btn.dataset.page).classList.remove("hidden");
  if(btn.dataset.page==="adminPage" && currentUser?.uid===ADMIN_UID)loadSubmissions();
  if(btn.dataset.page==="walletPage")loadWallet();
 };
});

async function loadTasks(){
 const list=$("tasksList");
 list.textContent="Loading...";
 try{
  const snap=await getDocs(collection(db,"tasks"));
  list.replaceChildren();
  if(snap.empty){list.textContent="Abhi koi task nahi hai.";return;}
  snap.forEach(item=>{
   const t=item.data();
   const div=document.createElement("div");
   div.className="task";
   const title=document.createElement("h4");
   title.textContent=t.title||"Task";
   const desc=document.createElement("p");
   desc.textContent=t.description||"";
   const reward=document.createElement("b");
   reward.textContent="Reward: ₹"+(Number(t.reward)||0);
   div.append(title,desc,reward);

   if(t.link){
    const a=document.createElement("a");
    a.href=t.link;a.target="_blank";a.rel="noopener";
    a.textContent=" Open Task";
    div.append(a);
   }

   const proof=document.createElement("input");
   proof.placeholder="Task proof / details";
   const submit=document.createElement("button");
   submit.textContent="Submit Task";
   submit.onclick=async()=>{
    if(!proof.value.trim()){alert("Proof likho.");return;}
    submit.disabled=true;
    try{
     await addDoc(collection(db,"submissions"),{
      userId:currentUser.uid,
      taskId:item.id,
      proof:proof.value.trim(),
      status:"pending",
      submittedAt:serverTimestamp()
     });
     alert("Submission bhej di gayi. Approval ka wait karo.");
    }catch(e){
     alert("Error: "+e.message);
     submit.disabled=false;
    }
   };
   div.append(proof,submit);
   list.append(div);
  });
 }catch(e){list.textContent="Error: "+e.message;}
}

async function loadWallet(){
 try{
  const snap=await getDoc(doc(db,"wallets",currentUser.uid));
  const amount=snap.exists()?Number(snap.data().balance)||0:0;
  $("balance").textContent=amount;
  $("walletBalance").textContent=amount;
 }catch(e){console.error(e);}
}

$("addTask").onclick=async()=>{
 if(currentUser?.uid!==ADMIN_UID)return;
 const title=$("taskTitle").value.trim();
 const description=$("taskDescription").value.trim();
 const reward=Number($("taskReward").value);
 const link=$("taskLink").value.trim();

 if(!title||!description||!Number.isFinite(reward)||reward<=0){
  msg("adminMsg","Title, details aur valid reward bharo.");
  return;
 }
 if(link && !/^https?:\/\//i.test(link)){
  msg("adminMsg","Link http:// ya https:// se shuru hona chahiye.");
  return;
 }
 try{
  await addDoc(collection(db,"tasks"),{
   title,description,reward,link,
   createdAt:serverTimestamp()
  });
  msg("adminMsg","Task add ho gaya!");
  $("taskTitle").value="";
  $("taskDescription").value="";
  $("taskReward").value="";
  $("taskLink").value="";
  await loadTasks();
 }catch(e){msg("adminMsg","Error: "+e.message);}
};

$("refreshSubmissions").onclick=loadSubmissions;

async function loadSubmissions(){
 if(currentUser?.uid!==ADMIN_UID)return;
 const list=$("submissionsList");
 list.textContent="Loading...";
 try{
  const snap=await getDocs(
   query(collection(db,"submissions"),where("status","==","pending"))
  );
  list.replaceChildren();
  if(snap.empty){list.textContent="Koi pending submission nahi hai.";return;}

  for(const item of snap.docs){
   const s=item.data();
   const div=document.createElement("div");
   div.className="task";
   const details=document.createElement("p");
   details.textContent="User: "+s.userId+" | Task: "+s.taskId+" | Proof: "+s.proof;
   const approve=document.createElement("button");
   approve.className="green";
   approve.textContent="Approve";
   const reject=document.createElement("button");
   reject.className="red";
   reject.textContent="Reject";

   approve.onclick=()=>reviewSubmission(item.id,true,approve,reject);
   reject.onclick=()=>reviewSubmission(item.id,false,approve,reject);
   div.append(details,approve,reject);
   list.append(div);
  }
 }catch(e){list.textContent="Error: "+e.message;}
}

async function reviewSubmission(id,approved,approveBtn,rejectBtn){
 if(currentUser?.uid!==ADMIN_UID)return;
 approveBtn.disabled=true;rejectBtn.disabled=true;
 try{
  await runTransaction(db,async transaction=>{
   const submissionRef=doc(db,"submissions",id);
   const submissionSnap=await transaction.get(submissionRef);
   if(!submissionSnap.exists())throw new Error("Submission nahi mili.");
   const s=submissionSnap.data();
   if(s.status!=="pending")throw new Error("Ye submission pehle hi review ho chuki hai.");

   const submissionUpdate={
    status:approved?"approved":"rejected",
    reviewedAt:serverTimestamp()
   };
   if(approved){
    const taskSnap=await transaction.get(doc(db,"tasks",s.taskId));
    if(!taskSnap.exists())throw new Error("Task nahi mila.");
    const reward=Number(taskSnap.data().reward);
    if(!Number.isFinite(reward)||reward<=0)throw new Error("Invalid reward.");

    const walletRef=doc(db,"wallets",s.userId);
    const walletSnap=await transaction.get(walletRef);
    const oldBalance=walletSnap.exists()?Number(walletSnap.data().balance)||0:0;
    transaction.set(walletRef,{balance:oldBalance+reward,updatedAt:serverTimestamp()});
   }
   transaction.update(submissionRef,submissionUpdate);
  });
  alert(approved?"Approved! Reward wallet mein add ho gaya.":"Submission rejected.");
  await loadSubmissions();
 }catch(e){
  alert("Review error: "+e.message);
  approveBtn.disabled=false;rejectBtn.disabled=false;
 }
}
</script>
</body>
</html>
